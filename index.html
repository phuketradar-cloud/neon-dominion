<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Dominion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/v3.css">
</head>
<body>
  <!-- Faction selection (rendered by main.js) -->
  <div id="start" class="app-screen hidden"></div>
  <!-- New game setup (rendered by main.js) -->
  <div id="setupscr" class="app-screen hidden"></div>

  <!-- Main city screen -->
  <div id="game" class="hidden">
    <header id="topbar">
      <div class="brand"><span class="brand-mark"></span><span class="brand-t">NEON <b>DOMINION</b></span></div>
      <div id="resources" data-cmd="treasury" title="Treasury"></div>
      <div class="tb-stats">
        <div id="turn" class="pill"></div>
        <div id="ops" class="pill"></div>
        <button id="unitpill" class="pill" data-screen="units"></button>
        <button id="rdpill" class="pill" data-screen="research"></button>
      </div>
      <nav class="tb-nav">
        <button class="nav-b" data-screen="report" data-icon="briefing" title="Briefing"><span>Briefing</span></button>
        <button class="nav-b" data-screen="units" data-icon="units" title="Units"><span>Units</span></button>
        <button class="nav-b" data-screen="recruit" data-icon="recruit" title="Recruit"><span>Recruit</span></button>
        <button class="nav-b" data-screen="armory" data-icon="armory" title="Armory"><span>Armory</span></button>
        <button class="nav-b" data-screen="battles" data-icon="battles" title="Battles"><span>Battles</span></button>
        <button class="nav-b" data-screen="diplomacy" data-icon="diplomacy" title="Diplomacy"><span>Diplomacy</span></button>
        <button class="nav-b" data-screen="factions" data-icon="factions" title="Factions"><span>Factions</span></button>
        <button class="nav-b" data-screen="intel" data-icon="intelnav" title="Intel"><span>Intel</span></button>
        <button class="nav-b" data-screen="victory" data-icon="victory" title="Objectives"><span>Objectives</span></button>
        <button class="nav-b" data-screen="help" data-icon="manual" title="Manual"><span>Manual</span></button>
        <button class="nav-b" data-screen="settings" data-icon="settings" title="Settings"><span>Settings</span></button>
      </nav>
      <button id="btn-end" class="btn end" data-cmd="end" data-icon="end">END TURN</button>
    </header>
    <aside id="left"></aside>
    <main id="center">
      <canvas id="map"></canvas>
      <div id="map-tools"></div>
      <div id="tooltip" class="hidden"></div>
      <div id="move-banner" class="hidden"></div>
    </main>
    <aside id="right"></aside>
    <footer id="actions"></footer>
  </div>

  <!-- Full-screen secondary screens (rendered by screens.js) -->
  <div id="screen" class="hidden">
    <header class="scr-head">
      <button class="btn scr-back" data-cmd="close" title="Back to the city (Esc)">‹ City</button>
      <h1 id="screen-title"></h1>
      <nav id="screen-nav"></nav>
    </header>
    <div id="screen-body"></div>
  </div>

  <!-- Small dialogs only -->
  <div id="modal" class="hidden">
    <div class="modal-box">
      <div class="modal-head"><h2 id="modal-title"></h2><button class="btn sm" data-cmd="close">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toasts"></div>
  <div id="turnflash" class="hidden"></div>
  <div id="busy" class="hidden"></div>

  <!-- Game logic (no DOM access) -->
  <script src="js/core/rng.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/world.js"></script>
  <script src="js/core/economy.js"></script>
  <script src="js/core/actions.js"></script>
  <script src="js/core/units.js"></script>
  <script src="js/core/combat.js"></script>
  <script src="js/core/tech.js"></script>
  <script src="js/core/espionage.js"></script>
  <script src="js/core/diplomacy.js"></script>
  <script src="js/core/victory.js"></script>
  <script src="js/core/market.js"></script>
  <script src="js/core/ai.js"></script>
  <script src="js/core/turn.js"></script>
  <script src="js/core/save.js"></script>
  <!-- Rendering / interface -->
  <script src="js/view/icons.js"></script>
  <script src="js/view/art.js"></script>
  <script src="js/view/portraits.js"></script>
  <script src="js/view/mapview.js"></script>
  <script src="js/view/ui.js"></script>
  <script src="js/view/screens.js"></script>
  <script src="js/view/tutorial.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
